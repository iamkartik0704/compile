      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create v$version --draft --title "v$version" --notes "Release v$version" || true

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-13
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # Automatically caches node_modules for faster builds

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'

      - name: Install Dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Build Windows Executable
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          DEBUG: electron-builder,electron-rebuild:*
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_OPTIONS: --max-old-space-size=8192
        timeout-minutes: 15

      - name: Build macOS Executable
        if: startsWith(matrix.os, 'macos')
        run: |
          sips -z 1024 1024 build/icon.png
          npm run dist:mac:${{ matrix.arch }}
        env:
          DEBUG: electron-builder,electron-rebuild:*
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          NODE_OPTIONS: --max-old-space-size=8192
        timeout-minutes: 30

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "VERSION=$version" >> $GITHUB_ENV

      # STEP A: Still saves the file as a temporary artifact on standard commits to main
      - uses: actions/upload-artifact@v4
        with:
          name: compile-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/*.app/**/*

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/auto-update' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release edit v$version --draft=false || true
