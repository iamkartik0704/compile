appId: com.compile.editor
productName: comπle Editor
artifactName: compile-${version}-${os}-${arch}.${ext}
compression: normal
nativeRebuilder: legacy
directories:
  buildResources: build
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - 'build/icon.ico'
publish:
  - provider: github
win:
  executableName: compile-editor
  icon: build/icon.ico
  target:
    - nsis
  extraResources:
    - from: "resources/llvm-win-x64"
      to: "llvm"
      filter:
        - "**/*"
nsis:
  include: "build/installer.nsh"
mac:
  target: ['zip']
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  binaries:
    - './node_modules/node-pty/build/Release/spawn-helper'
    - './resources/llvm-mac-arm64/bin/clangd'
    - './resources/llvm-mac-arm64/bin/clang++'
    - './resources/llvm-mac-arm64/bin/clang'
  extraResources:
    - from: "resources/llvm-mac-arm64"
      to: "llvm"
      filter:
        - "!**/*"
        - "bin/clangd"
        - "bin/clang++"
        - "bin/clang"
        - "lib/clang/*/include/**/*"
        - "lib/*.dylib"
        - "include/c++/**/*"
        - "include/x86_64-unknown-linux-gnu/c++/**/*"
        - "include/aarch64-unknown-linux-gnu/c++/**/*"
        - "NOTICE.TXT"
afterPack: scripts/fix-permissions.js
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: compile-editor
  category: Development
protocols:
  - name: Comiple Deep Link
    schemes:
      - comiple
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/pyright/**'
